<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>xer x</title>
    <link rel="icon" href="icon1.jpg" type="image/png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            background-image: url('');
            background-size: cover;
            background-position: center;
            font-family: 'Cinzel', serif;
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 3em;
            text-shadow: 2px 2px 8px #ffcc00;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        input[type="text"] {
            padding: 10px;
            width: 300px;
            border-radius: 5px;
            border: none;
            margin-bottom: 10px;
            font-size: 16px;
        }

        button {
            padding: 10px 30px;
            font-size: 18px;
            background-color: #ffcc00;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 10px #ffcc00;
        }

        .message {
            margin-top: 20px;
            color: #ff6666;
        }

        .hidden {
            display: none;
        }

        #changeBackgroundButton {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background-color: #4CAF50;
            padding: 10px 20px;
            color: #fff;
            border: none;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }

        #themeToggleButton {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: transparent;
            border: none;
            font-size: 30px;
            cursor: pointer;
            color: #fff;
        }

        .icon {
            font-size: 20px;
        }

        #backgroundInput {
            display: none;
        }
    </style>
</head>
<body>
    <h1>Dowload Video</h1>
    <form method="POST">
        <input type="text" name="url" placeholder="link video">
        <button type="submit">Dowload</button>
    </form>

    <button id="changeBackgroundButton">เปลี่ยนรูปพื้นหลัง</button>
    <input type="file" id="backgroundInput" accept="image/*" onchange="changeBackground(event)">

    <div class="message {% if not message %}hidden{% endif %}">{{ message }}</div>

    <button id="themeToggleButton" onclick="toggleTheme()">
        <span id="themeIcon" class="icon">🌙</span>
    </button>

    <script>
        function changeBackground(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.body.style.backgroundImage = `url(${e.target.result})`;
                    localStorage.setItem('backgroundImage', e.target.result);
                }
                reader.readAsDataURL(file);
            }
        }

        document.getElementById('changeBackgroundButton').onclick = function() {
            document.getElementById('backgroundInput').click();
        }

        let isDarkTheme = true;
        function toggleTheme() {
            if (isDarkTheme) {
                document.body.style.backgroundColor = "#f0f0f0";
                document.body.style.color = "#000";
                document.getElementById("themeIcon").textContent = "🌞";
                localStorage.setItem('theme', 'light');
            } else {
                document.body.style.backgroundColor = "#000";
                document.body.style.color = "#fff";
                document.getElementById("themeIcon").textContent = "🌙";
                localStorage.setItem('theme', 'dark');
            }
            isDarkTheme = !isDarkTheme;
        }

        window.onload = function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.body.style.backgroundColor = "#f0f0f0";
                document.body.style.color = "#000";
                document.getElementById("themeIcon").textContent = "🌞";
                isDarkTheme = false;
            }

            const savedBackground = localStorage.getItem('backgroundImage');
            if (savedBackground) {
                document.body.style.backgroundImage = `url(${savedBackground})`;
            }
        }
    </script>
</body>
</html>
